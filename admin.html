<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrador - El Callejón del Barbero</title>

<style>
body{background:#111;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px;}
.panel{max-width:500px;margin:auto;}
.dia,.cliente{background:#1b1b1b;padding:15px;margin-bottom:15px;border-radius:12px;}
input{width:90%;padding:10px;margin-top:8px;border-radius:8px;border:none;}
button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#8d99ae;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.estado{
    color:#8d99ae;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Panel Administrador</h1>

<div class="panel">

<h2>Horarios disponibles</h2>

<div class="dia"><h3>Lunes</h3><input type="text" id="lunes" placeholder="Ej: 4/5/6/7"></div>
<div class="dia"><h3>Martes</h3><input type="text" id="martes" placeholder="Ej: 4/5/6/7"></div>
<div class="dia"><h3>Miércoles</h3><input type="text" id="miercoles" placeholder="Ej: 4/5/6/7"></div>
<div class="dia"><h3>Jueves</h3><input type="text" id="jueves" placeholder="Ej: 4/5/6/7"></div>
<div class="dia"><h3>Viernes</h3><input type="text" id="viernes" placeholder="Ej: 4/5/6/7"></div>
<div class="dia"><h3>Sábado</h3><input type="text" id="sabado" placeholder="Ej: 11/12/1/3/5"></div>
<div class="dia"><h3>Domingo</h3><input type="text" id="domingo" placeholder="Ej: 4/5/6/7"></div>

<button onclick="guardar()">Guardar Citas</button>

<h2 style="margin-top:35px;">Clientes registrados</h2>
<div id="listaClientes"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, getDocs, updateDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaLuLg_Tp-0bgzpB1DiPR7VmIrmLLFFSM",
  authDomain: "elcallejondelbarbero-54.firebaseapp.com",
  projectId: "elcallejondelbarbero-54",
  storageBucket: "elcallejondelbarbero-54.firebasestorage.app",
  messagingSenderId: "1002549966536",
  appId: "1:1002549966536:web:d805a8e535d25198a257fd",
  measurementId: "G-EQBV95SNJV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.guardar = async function() {
    const dias = ["lunes","martes","miercoles","jueves","viernes","sabado","domingo"];

    const horarios = {};

    dias.forEach(dia => {
        horarios[dia] = document.getElementById(dia).value.trim();
    });

    try {
        await setDoc(doc(db, "configuracion", "horarios"), horarios);
        alert("Citas guardadas correctamente en Firebase");
    } catch (error) {
        console.error(error);
        alert("Error al guardar horarios");
    }
}

async function cargarHorarios() {
    try {
        const referencia = doc(db, "configuracion", "horarios");
        const documento = await getDoc(referencia);

        if (!documento.exists()) return;

        const horarios = documento.data();

        Object.keys(horarios).forEach(dia => {
            const input = document.getElementById(dia);
            if (input) {
                input.value = horarios[dia];
            }
        });

    } catch (error) {
        console.error(error);
        alert("Error al cargar horarios");
    }
}
    
async function cargarClientes() {
    const contenedor = document.getElementById("listaClientes");
    contenedor.innerHTML = "<p>Cargando clientes...</p>";

    const querySnapshot = await getDocs(collection(db, "clientes"));

    if (querySnapshot.empty) {
        contenedor.innerHTML = "<p>No hay clientes registrados.</p>";
        return;
    }

    contenedor.innerHTML = "";

    querySnapshot.forEach((documento) => {
        const cliente = documento.data();
        const id = documento.id;

        contenedor.innerHTML += `
            <div class="cliente">
                <p><strong>Nombre:</strong> ${cliente.nombre || "Sin nombre"}</p>
                <p><strong>WhatsApp:</strong> ${cliente.telefono || "No registrado"}</p>
                <p><strong>Correo:</strong> ${cliente.correo || "No registrado"}</p>
                <p><strong>Nacimiento:</strong> ${cliente.fechaNacimiento || "No registrado"}</p>
                <p><strong>Estado:</strong> <span class="estado">${cliente.estado || "Pendiente"}</span></p>

                <button onclick="aprobarCliente('${id}')">Aprobar cliente</button>
                <button onclick="rechazarCliente('${id}')">Rechazar cliente</button>
            </div>
        `;
    });
}

window.aprobarCliente = async function(id) {
    try {
        await updateDoc(doc(db, "clientes", id), {
            estado: "Aprobado",
            mensajeAdmin: "Tu cuenta fue aprobada ✅ Ya puedes usar tu perfil."
        });

        alert("Cliente aprobado");
        cargarClientes();

    } catch (error) {
        console.error(error);
        alert("Error al aprobar cliente");
    }
}

window.rechazarCliente = async function(id) {
    try {
        await updateDoc(doc(db, "clientes", id), {
            estado: "Rechazado",
            mensajeAdmin: "Tu cuenta no fue aprobada por el momento. Puedes seguir agendando por WhatsApp."
        });

        alert("Cliente rechazado");
        cargarClientes();

    } catch (error) {
        console.error(error);
        alert("Error al rechazar cliente");
    }
}

window.onload = function() {
    cargarHorarios();
    cargarClientes();
};
</script>

</body>
</html>
