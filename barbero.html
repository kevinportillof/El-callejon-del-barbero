<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Barbero - El Callejón del Barbero</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(135deg,#050505,#151515,#050505);
  color:#f4f4f4;
  font-family:Arial,sans-serif;
}

.login{
  max-width:380px;
  margin:80px auto;
  padding:25px;
  background:#141414;
  border:1px solid #2b2b2b;
  border-radius:22px;
}

input,select,textarea{
  width:100%;
  margin:8px 0;
  padding:13px;
  border-radius:12px;
  border:1px solid #333;
  background:#090909;
  color:white;
}

button{
  border:none;
  border-radius:999px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#f5f5f5;
  color:#111;
}

.btn-dark{
  background:#252525;
  color:white;
  border:1px solid #444;
}

.btn-red{
  background:#321919;
  color:#ff8b8b;
  border:1px solid #663333;
}

header{
  padding:20px;
  border-bottom:1px solid #2b2b2b;
  background:#090909;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:5px 0 0;
  color:#aaa;
}

.menu{
  display:flex;
  gap:10px;
  padding:15px 20px;
  flex-wrap:wrap;
}

main{
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.seccion{display:none}
.seccion.activa{display:block}

.card{
  background:#141414;
  border:1px solid #2b2b2b;
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
}

.agenda{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:12px;
}

.dia{
  background:#101010;
  border:1px solid #333;
  border-radius:18px;
  padding:12px;
  min-height:250px;
}

.dia h3{
  margin:0 0 12px;
  text-align:center;
  border-bottom:1px solid #333;
  padding-bottom:10px;
}

.cita{
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:14px;
  padding:10px;
  margin-bottom:10px;
}

.cita strong{display:block}
.cita span{color:#aaa;font-size:13px}

.empty{
  color:#777;
  text-align:center;
  padding:20px;
}

@media(max-width:900px){
  .agenda{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="loginBox" class="login">
  <h2>Panel Barbero 💈</h2>
  <input id="usuario" placeholder="Usuario">
  <input id="password" type="password" placeholder="Contraseña">

<div style="text-align:right;margin-top:-4px;margin-bottom:10px;">
  <span onclick="verPassword()" style="cursor:pointer;color:#aaa;font-size:13px;">
    👁 Ver contraseña
  </span>
</div>
  <button class="btn" style="width:100%" onclick="loginBarbero()">Entrar</button>
  
  <p id="errorLogin"
style="
color:#ff8b8b;
text-align:center;
display:none;
margin-top:10px;
font-size:14px;">
</p>
</div>

<div id="panel" style="display:none;">

<header>
  <h1>Agenda Semanal</h1>
  <p id="nombreBarbero">El Callejón del Barbero</p>
</header>

<nav class="menu">
  <button class="btn" onclick="mostrar('agenda')">Agenda semanal</button>
  <button class="btn-dark" onclick="mostrar('agregar')">Agregar cita</button>
  <button class="btn-dark" onclick="cerrarSesion()">Cerrar sesión</button>
</nav>

<main>

<section id="agenda" class="seccion activa">
  <div class="card">
    <h2>Mis citas de la semana</h2>
    <div id="agendaSemanal" class="agenda"></div>
  </div>
</section>

<section id="agregar" class="seccion">
  <div class="card">
    <h2>Agregar cita</h2>

    <input id="cliente" placeholder="Nombre del cliente">
    <input id="fecha" type="date">
    <input id="hora" type="time">
    <input id="servicio" placeholder="Servicio">
    <textarea id="nota" placeholder="Nota opcional"></textarea>

    <button class="btn" onclick="agregarCita()">Guardar cita</button>
  </div>
</section>

</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaLuLg_Tp-0bgzpB1DiPR7VmIrmLLFFSM",
  authDomain: "elcallejondelbarbero-54.firebaseapp.com",
  projectId: "elcallejondelbarbero-54",
  storageBucket: "elcallejondelbarbero-54.firebasestorage.app",
  messagingSenderId: "1002549966536",
  appId: "1:1002549966536:web:d805a8e535d25198a257fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let barberoActivo = null;
let citas = [];

window.mostrar = function(id){
  document.querySelectorAll(".seccion").forEach(s => s.classList.remove("activa"));
  document.getElementById(id).classList.add("activa");
};

window.loginBarbero = async function(){
  const usuario = document.getElementById("usuario").value.trim().toLowerCase();
  const password = document.getElementById("password").value.trim();

  const snap = await getDocs(collection(db,"barberos"));
  let encontrado = null;

  snap.forEach(docu => {
    const b = docu.data();
    if(
     String(b.usuario || "").trim().toLowerCase() === usuario &&
String(b.password || "").trim() === password &&
      b.activo !== false
    ){
      encontrado = { id: docu.id, ...b };
    }
  });

  if(!encontrado){

  const error = document.getElementById("errorLogin");

  error.style.display = "block";
  error.textContent =
    "❌ Usuario o contraseña incorrectos";

  return;
}
  
document.getElementById("errorLogin").style.display = "none";
  barberoActivo = encontrado;

  localStorage.setItem("barberoId", encontrado.id);
  localStorage.setItem("barberoNombre", encontrado.nombre);

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("panel").style.display = "block";
  document.getElementById("nombreBarbero").textContent = encontrado.nombre;

  cargarCitas();
};

window.cerrarSesion = function(){
  localStorage.removeItem("barberoId");
  localStorage.removeItem("barberoNombre");
  location.reload();
};

function fechaISO(diasExtra){
  const f = new Date();
  f.setDate(f.getDate() + diasExtra);
  return f.toISOString().split("T")[0];
}

function nombreDia(fecha){
  const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const f = new Date(fecha + "T00:00:00");
  return dias[f.getDay()];
}

async function cargarCitas(){
  const snap = await getDocs(collection(db,"citas"));
  citas = [];

  snap.forEach(docu => {
    citas.push({ id:docu.id, ...docu.data() });
  });

  renderAgenda();
}

function renderAgenda(){
  const contenedor = document.getElementById("agendaSemanal");
  contenedor.innerHTML = "";

  for(let i = 0; i < 7; i++){
    const fecha = fechaISO(i);

    const citasDia = citas
      .filter(c =>
        c.fecha === fecha &&
        c.barberoId === barberoActivo.id &&
        c.estado !== "Cancelada"
      )
      .sort((a,b) => a.hora.localeCompare(b.hora));

    let html = `
      <div class="dia">
        <h3>${nombreDia(fecha)}<br><small>${fecha}</small></h3>
    `;

    if(citasDia.length === 0){
      html += `<div class="empty">Sin citas</div>`;
    }else{
      citasDia.forEach(c => {
        html += `
          <div class="cita">
            <strong>${c.hora} · ${c.cliente}</strong>
            <span>${c.servicio || "Servicio"}</span>
            ${c.nota ? `<p>${c.nota}</p>` : ""}
            <button class="btn-red" onclick="solicitarReagendar('${c.id}')">
              Solicitar reagendar
            </button>
          </div>
        `;
      });
    }

    html += `</div>`;
    contenedor.innerHTML += html;
  }
}

window.agregarCita = async function(){
  const cita = {
    cliente: document.getElementById("cliente").value.trim(),
    fecha: document.getElementById("fecha").value,
    hora: document.getElementById("hora").value,
    servicio: document.getElementById("servicio").value.trim(),
    nota: document.getElementById("nota").value.trim(),
    estado: "Confirmada",
    barberoId: barberoActivo.id,
    barberoNombre: barberoActivo.nombre,
    creadaPor: "barbero",
    creadaEn: serverTimestamp()
  };

  if(!cita.cliente || !cita.fecha || !cita.hora || !cita.servicio){
    alert("Faltan datos");
    return;
  }

  await addDoc(collection(db,"citas"), cita);

  document.getElementById("cliente").value = "";
  document.getElementById("fecha").value = "";
  document.getElementById("hora").value = "";
  document.getElementById("servicio").value = "";
  document.getElementById("nota").value = "";

  alert("Cita agregada");
  cargarCitas();
  mostrar("agenda");
};

window.solicitarReagendar = async function(id){
  const motivo = prompt("Motivo para solicitar reagendar:");
  if(!motivo) return;

  await updateDoc(doc(db,"citas",id), {
    solicitudReagendar: true,
    motivoReagendar: motivo,
    estadoSolicitudReagendar: "Pendiente",
    solicitadoPorBarbero: barberoActivo.nombre,
    fechaSolicitudReagendar: serverTimestamp()
  });

  alert("Solicitud enviada al administrador");
  cargarCitas();
};

window.addEventListener("load", async () => {
  const id = localStorage.getItem("barberoId");
  const nombre = localStorage.getItem("barberoNombre");

  if(id && nombre){
    barberoActivo = { id, nombre };
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    document.getElementById("nombreBarbero").textContent = nombre;
    cargarCitas();
  }
});

  window.verPassword = function(){
  const input = document.getElementById("password");

  if(input.type === "password"){
    input.type = "text";
  }else{
    input.type = "password";
  }
};
  
</script>

</body>
</html>
